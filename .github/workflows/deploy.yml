# The real site is hosted on Cloudflare (wrangler.jsonc) at dylanprasodjo.com.
# This only keeps the old GitHub Pages address working: every page there
# forwards to the same page on dylanprasodjo.com.
name: Forward GitHub Pages to dylanprasodjo.com

on:
  push:
    branches: [main]
    paths: ['.github/redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir site
          cp .github/redirect/index.html site/index.html
          cp .github/redirect/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
